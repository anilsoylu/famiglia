name: project-end-production-ready
expected_outcome: |
  Treats this as the project-end stage and stays read-only (no file edits). Produces a production-readiness report with
  an overall verdict and checklist items rated PASS/PARTIAL/FAIL/N/A with file:line evidence. Has explicit server-dies
